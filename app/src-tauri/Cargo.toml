[package]
name = "zorza"
version = "0.6.1"
description = "Zorza Client - launcher Minecraft: Java Edition"
authors = ["RastamanPoland"]
edition = "2021"

[lib]
name = "zorza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
